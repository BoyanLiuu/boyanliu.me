name: Links

on:
  pull_request:
    paths: ["content/**", "README.md"]
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC: catch links that rot over time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-path node_modules
            --exclude '^https?://(127\.0\.0\.1|localhost)'
            --exclude 'linkedin\.com'
            'content/**/*.md' 'content/**/*.mdx' 'content/*.json' README.md
          fail: true
