<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">boyanliu.me</title>
  <desc id="hero-desc">Source of boyanliu.me, Shawn Liu's portfolio and writing. The Next.js app stays generic; everything personal lives in the content directory, typed by zod and checked at build. Built with Next.js 16, React 19, Tailwind v4, MDX and Vercel.</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- paper -->
  <rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="26" fill="#ffffff" stroke="#e6e3dd" stroke-width="1.5"/>

  <g id="title-block">
    <text class="mono" x="64" y="86" font-size="19" font-weight="600" letter-spacing="2.6" fill="#6f6c69">PERSONAL SITE · SOURCE</text>

    <text class="sans" x="64" y="180" font-size="78" font-weight="700" letter-spacing="-2.2" fill="#171310">boyanliu<tspan fill="#7b1e2b">.</tspan>me</text>

    <text class="sans" x="64" y="238" font-size="22.5" fill="#6f6c69">Shawn Liu’s portfolio and writing. The Next.js app stays generic —</text>
    <text class="sans" x="64" y="270" font-size="22.5" fill="#6f6c69">everything personal lives in <tspan class="mono" font-size="21" fill="#171310">content/</tspan>, checked at build time.</text>

    <text class="mono" x="64" y="334" font-size="19" fill="#6f6c69">Next.js 16 · React 19 · Tailwind v4 · MDX · Vercel</text>
  </g>

  <g id="content-specimen">
    <rect x="720" y="64" width="416" height="252" rx="14" fill="#f4f3f0" stroke="#e6e3dd" stroke-width="1.5"/>
    <text class="mono" x="748" y="100" font-size="18" letter-spacing="1.2" fill="#6f6c69">content/</text>
    <line x1="748" y1="118" x2="1108" y2="118" stroke="#e6e3dd" stroke-width="1.5"/>

    <text class="mono" x="748" y="156" font-size="20" fill="#171310">site.json</text>
    <text class="mono" x="748" y="188" font-size="20" fill="#171310">experience.json</text>
    <text class="mono" x="748" y="220" font-size="20" fill="#171310">posts/*.mdx</text>
    <text class="mono" x="748" y="252" font-size="20" fill="#171310">projects/*.mdx</text>

    <circle cx="754" cy="288" r="5" fill="#7b1e2b"/>
    <text class="sans" x="770" y="294" font-size="19" font-weight="600" fill="#7b1e2b">zod-checked at build</text>
  </g>
</svg>
