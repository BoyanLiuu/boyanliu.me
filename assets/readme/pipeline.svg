<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="300" viewBox="0 0 1200 300"
     role="img" aria-labelledby="pipe-title pipe-desc">
  <title id="pipe-title">From content to a static site</title>
  <desc id="pipe-desc">Three stages. You edit: JSON for the site, roles, bookmarks and changelog, plus posts and projects in MDX. Build checks: zod schemas type every field, so a typo or a missing cover fails the build, not production. Next.js generates: pages, Open Graph images, RSS, Atom and JSON feeds, sitemap, search index and the resume.</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .eyebrow { font-size: 18px; font-weight: 600; letter-spacing: 1.8px; fill: #6f6c69; }
      .heading { font-size: 25px; font-weight: 700; letter-spacing: -0.4px; }
      .item { font-size: 19px; fill: #6f6c69; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L9 5 L0 9 z" fill="#b9b3aa"/>
    </marker>
  </defs>

  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="26" fill="#ffffff" stroke="#e6e3dd" stroke-width="1.5"/>

  <g id="stage-edit">
    <rect x="56" y="64" width="316" height="180" rx="14" fill="#f4f3f0" stroke="#e6e3dd" stroke-width="1.5"/>
    <text class="mono eyebrow" x="84" y="100">YOU EDIT</text>
    <text class="mono heading" x="84" y="134" fill="#171310">content/</text>
    <text class="sans item" x="84" y="172">JSON for the site, roles,</text>
    <text class="sans item" x="84" y="198">bookmarks and changelog.</text>
    <text class="sans item" x="84" y="224">Posts and projects in MDX.</text>
  </g>

  <line x1="388" y1="154" x2="428" y2="154" stroke="#b9b3aa" stroke-width="2" marker-end="url(#arrow)"/>

  <g id="stage-validate">
    <rect x="442" y="64" width="316" height="180" rx="14" fill="#f4f3f0" stroke="#e6e3dd" stroke-width="1.5"/>
    <text class="mono eyebrow" x="470" y="100">BUILD CHECKS</text>
    <text class="sans heading" x="470" y="134" fill="#7b1e2b">zod schemas</text>
    <text class="sans item" x="470" y="172">Every field is typed. A typo</text>
    <text class="sans item" x="470" y="198">or a missing cover fails</text>
    <text class="sans item" x="470" y="224">the build — not production.</text>
  </g>

  <line x1="774" y1="154" x2="814" y2="154" stroke="#b9b3aa" stroke-width="2" marker-end="url(#arrow)"/>

  <g id="stage-generate">
    <rect x="828" y="64" width="316" height="180" rx="14" fill="#f4f3f0" stroke="#e6e3dd" stroke-width="1.5"/>
    <text class="mono eyebrow" x="856" y="100">NEXT.JS GENERATES</text>
    <text class="sans heading" x="856" y="134" fill="#171310">the static site</text>
    <text class="sans item" x="856" y="172">Pages, OG images, RSS,</text>
    <text class="sans item" x="856" y="198">Atom and JSON feeds,</text>
    <text class="sans item" x="856" y="224">sitemap, search, résumé.</text>
  </g>
</svg>
